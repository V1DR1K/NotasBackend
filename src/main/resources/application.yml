spring:
  application.name: cuaderno
  data.web.pageable.max-page-size: 100
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuaderno}
    username: ${SPRING_DATASOURCE_USERNAME:cuaderno}
    password: ${SPRING_DATASOURCE_PASSWORD:cuaderno}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: ${FILE_MAX_SIZE:10485760}
    max-request-size: ${FILE_MAX_REQUEST_SIZE:11534336}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints.web.base-path: /api/actuator
  endpoints.web.exposure.include: health,info
cuaderno:
  auth:
    service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    public-key-pem: ${AUTH_PUBLIC_KEY_PEM:}
    issuer: ${AUTH_JWT_ISSUER:central-auth-service}
    audience: ${AUTH_JWT_AUDIENCE:}
    client-timeout-ms: ${AUTH_CLIENT_TIMEOUT_MS:3000}
    default-role: ${AUTH_DEFAULT_ROLE:USER}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:CUADERNO_REFRESH}
    refresh-cookie-max-age: ${AUTH_REFRESH_COOKIE_MAX_AGE:P30D}
  security:
    cookie-name: ${JWT_COOKIE_NAME:CUADERNO_AUTH}
    secure-cookie: ${JWT_SECURE_COOKIE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://notes.neticar.com.ar,http://localhost:3000}
  files:
    root: ${FILE_STORAGE_ROOT:/var/lib/cuaderno/files}
    max-user-bytes: ${FILE_MAX_USER_BYTES:1073741824}
  exchange-rate:
    provider-url: ${EXCHANGE_RATE_PROVIDER_URL:https://dolarapi.com/v1/dolares/blue}
    fallback: ${EXCHANGE_RATE_FALLBACK:1.0}
    timeout-ms: ${EXCHANGE_RATE_TIMEOUT_MS:3000}
    cache-ttl-ms: ${EXCHANGE_RATE_CACHE_TTL_MS:30000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    timeout-ms: ${GEMINI_TIMEOUT_MS:10000}
