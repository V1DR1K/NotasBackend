spring:
  application.name: cuaderno
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuaderno}
    username: ${SPRING_DATASOURCE_USERNAME:cuaderno}
    password: ${SPRING_DATASOURCE_PASSWORD:cuaderno}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: ${FILE_MAX_SIZE:10485760}
    max-request-size: ${FILE_MAX_REQUEST_SIZE:11534336}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints.web.base-path: /api/actuator
  endpoints.web.exposure.include: health,info
cuaderno:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-characters}
    expiration: ${JWT_EXPIRATION:PT8H}
    cookie-name: ${JWT_COOKIE_NAME:CUADERNO_AUTH}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://notes.neticar.com.ar,http://localhost:3000}
  initial-user:
    username: ${APP_INITIAL_USER_USERNAME:tomas}
    password: ${APP_INITIAL_USER_PASSWORD:tomas}
  files:
    root: ${FILE_STORAGE_ROOT:/var/lib/cuaderno/files}
  exchange-rate:
    provider-url: ${EXCHANGE_RATE_PROVIDER_URL:}
    fallback: ${EXCHANGE_RATE_FALLBACK:1.0}
    timeout-ms: ${EXCHANGE_RATE_TIMEOUT_MS:3000}
